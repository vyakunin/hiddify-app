# family_vpn fork — build a single per-relative Android APK with a
# subscription URL baked in via --dart-define.
#
# Trigger via the GitHub UI: Actions → "family_vpn APK" → Run workflow.
# Provide:
#   sub_url   = e.g. https://assets.visa-bulletin.us/sub/<their_token>
#   user_name = used in the artifact name only, e.g. "alice"
#
# The resulting APK has the URL baked in. On first launch the app skips
# the intro and shows AddProfile pre-filled — one tap to enable.
#
# Repo secret BAKED_SUB_URL is unused by this workflow (it's only used
# by the regular build.yml when the Hiddify maintainers' release workflow
# fires). Per-build URL comes from workflow input.

name: family_vpn APK

on:
  workflow_dispatch:
    inputs:
      sub_url:
        description: "Subscription URL to bake into the APK (e.g. https://assets.visa-bulletin.us/sub/<token>)"
        type: string
        required: true
      user_name:
        description: "User name for the artifact (alphanumeric, used in filename only)"
        type: string
        required: false
        default: "operator"

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Read pinned version from .fvmrc / pubspec.yaml flutter constraint;
          # falling back to whatever subosito resolves on stable.
          flutter-version: '3.38.x'

      - name: Setup Android signing (skipped if keystore not configured)
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_FILE_BASE64" ]; then
            echo "$KEYSTORE_FILE_BASE64" | base64 -d > android/app/key.jks
            cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=key.jks
          EOF
            echo "Signing configured."
          else
            echo "No keystore secret set; APK will be debug-signed (sideload-friendly, no Play Store-grade signing)."
          fi

      - name: Prepare (flutter pub get + dart code-gen + download libbox AAR)
        run: make android-apk-prepare

      - name: Install fastforge (used by Makefile's android-apk-release)
        run: dart pub global activate fastforge

      - name: Build APK
        env:
          BAKED_SUB_URL: ${{ inputs.sub_url }}
          SENTRY_DSN: ""
        run: |
          export PATH="$HOME/.pub-cache/bin:$PATH"
          make android-apk-release

      - name: Rename APKs to include user name
        run: |
          mkdir -p out
          USER="${{ inputs.user_name }}"
          # fastforge writes APKs to dist/<version>/*.apk
          find dist -name '*.apk' -print -exec sh -c '
            base=$(basename "$1" .apk)
            cp "$1" "out/${base}-${USER}.apk"
          ' _ {} \;
          ls -la out/ || echo "(no APKs found — check upstream build target output path)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: family_vpn-${{ inputs.user_name }}-apks
          path: out/*.apk
          retention-days: 30
